name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # - ./gradlew comes from the committed wrapper, so CI and local builds use the same Gradle.
      # - android.builder.sdkDownload lets AGP fetch the exact platform this project compiles
      #   against (android-36.1); without it the build cannot resolve compileSdk.
      # - No keystore step is needed: AGP creates and uses the default debug keystore itself.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -Pandroid.builder.sdkDownload=true --stacktrace

      - name: Verify the APK really exists (and is signed)
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -s "$APK" ]; then
            echo "::error::Expected a debug APK at $APK but it is missing or empty"
            exit 1
          fi
          ls -lh "$APK"
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${APKSIGNER:-}" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo "::warning::apksigner not found, skipped signature verification"
          fi

      # if-no-files-found: error - a green run must never finish without the APK attached.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: TabX-DLDL-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download the debug APK built above
        uses: actions/download-artifact@v8
        with:
          name: TabX-DLDL-Debug-APK
          path: artifacts

      # Add these repository secrets to publish a properly signed release APK:
      #   KEYSTORE_BASE64 - base64 of your upload keystore (.jks)
      #   STORE_PASSWORD  - keystore password
      #   KEY_PASSWORD    - key password
      #   KEY_ALIAS       - key alias (optional, defaults to "upload")
      # Without KEYSTORE_BASE64 the debug APK is published instead, clearly named as such.
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "Release keystore restored."
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::notice::No KEYSTORE_BASE64 secret, so the debug APK will be published."
          fi

      - name: Build signed release APK
        if: env.SIGNING_READY == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease -Pandroid.builder.sdkDownload=true --stacktrace

      - name: Collect the APK to publish
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${SIGNING_READY}" = "true" ] && [ -s app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/TabX-${GITHUB_REF_NAME}-release.apk"
          else
            cp artifacts/app-debug.apk "out/TabX-${GITHUB_REF_NAME}-debug.apk"
          fi
          ls -lh out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
